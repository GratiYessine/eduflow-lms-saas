spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false

logging:
  level:
    root: INFO
    com.example.lms: INFO

server:
  forward-headers-strategy: framework

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://eduflow-lms-e0f9b.web.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:},${FRONTEND_BASE_URL:https://eduflow-lms-e0f9b.web.app},https://eduflow-lms-e0f9b.web.app
  jwt:
    secret: ${JWT_SECRET}
  mail:
    enabled: ${MAIL_ENABLED:false}
  security:
    auth-rate-limit:
      backend: redis
  logging:
    json: ${JSON_LOGS:true}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info}
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
