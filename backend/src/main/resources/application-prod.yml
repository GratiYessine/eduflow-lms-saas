spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false

logging:
  level:
    root: INFO
    com.example.lms: INFO

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}
  jwt:
    secret: ${JWT_SECRET}
  mail:
    enabled: ${MAIL_ENABLED:true}
  security:
    auth-rate-limit:
      backend: redis
  logging:
    json: ${JSON_LOGS:true}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
